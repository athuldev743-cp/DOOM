<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>DOOM AI</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DOOM" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --red: #ff3333;
      --red-dim: #ff333322;
      --red-border: #ff333344;
      --bg: #080808;
      --bg2: #0f0f0f;
      --bg3: #161616;
      --border: #1e1e1e;
      --text: #e8e8e8;
      --text-dim: #555;
      --text-mid: #888;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    /* ── LAYOUT ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: var(--red);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: white;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse-dot 2s infinite;
    }

    .status-dot.thinking {
      background: #f59e0b;
      animation: pulse-dot 0.5s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text-dim);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-btn:hover, .icon-btn.active {
      border-color: var(--red-border);
      color: var(--red);
      background: var(--red-dim);
    }

    /* ── MESSAGES ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 0; }

    .msg-row {
      display: flex;
      gap: 10px;
      animation: fadeUp 0.25s ease forwards;
    }

    .msg-row.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .avatar.doom {
      background: var(--red);
      color: white;
    }

    .avatar.user {
      background: #1e3a5f;
      color: #60a5fa;
    }

    .bubble {
      max-width: calc(100% - 50px);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.doom {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text);
    }

    .bubble.user {
      background: #1e3a5f;
      border: 1px solid #2a4a7f;
      border-top-right-radius: 4px;
      color: #e0eeff;
    }

    .thinking-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }

    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── VOICE BANNER ── */
    .voice-banner {
      display: none;
      padding: 8px 18px;
      background: var(--red-dim);
      border-top: 1px solid var(--red-border);
      font-size: 12px;
      color: var(--red);
      text-align: center;
      font-family: 'DM Mono', monospace;
      flex-shrink: 0;
      letter-spacing: 0.1em;
    }

    .voice-banner.active { display: block; }

    /* ── INPUT AREA ── */
    .input-area {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 20px max(16px, env(safe-area-inset-bottom));
      border-top: 1px solid transparent;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      flex-shrink: 0;
    }

    /* Modern LLM-style composer */
    .composer {
      width: min(100%, 900px);
      min-width: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 9px 10px 9px 16px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 4px 20px #00000030;
      transition: border-color .2s, box-shadow .2s, border-radius .2s;
    }

    .composer:focus-within {
      border-color: var(--red-border);
      box-shadow: 0 4px 24px #00000045;
    }

    .composer #input {
      flex: 1;
      min-width: 0;
      min-height: 26px;
      max-height: 190px;
      height: 28px;
      padding: 4px 2px;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      color: var(--text);
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
      resize: none;
      overflow-y: hidden;
      line-height: 1.5;
      transition: height .12s ease;
    }

    .composer #input:focus {
      border: none;
    }

    .composer #input::placeholder {
      color: var(--text-dim);
    }

    .composer .mic-btn,
    .composer .send-btn {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .composer .mic-btn {
      border: none;
      background: transparent;
      color: var(--text-mid);
      font-size: 16px;
    }

    .composer .mic-btn:hover {
      background: var(--bg2);
      color: var(--text);
    }

    .composer .send-btn {
      font-size: 14px;
    }

    .composer .send-btn:disabled {
      opacity: .45;
    }

    /* Batch answer: one clean result card containing every requested company. */
    .batch-results {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
    }

    .batch-result {
      padding: 16px 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .batch-result:first-child {
      padding-top: 2px;
    }

    .batch-result:last-child {
      border-bottom: 0;
      padding-bottom: 2px;
    }

    .batch-company {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 4px;
    }

    .batch-finding {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--text-dim);
      margin-bottom: 9px;
      font-family: 'DM Mono', monospace;
    }

    .batch-content {
      line-height: 1.65;
    }

    @media (max-width: 600px) {
      .input-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      .composer {
        width: 100%;
        border-radius: 22px;
      }

      .composer #input {
        max-height: 150px;
      }
    }

    .mic-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text-dim);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .mic-btn.listening {
      border-color: var(--red);
      background: var(--red-dim);
      color: var(--red);
      animation: pulse-ring 1s infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 #ff333333; }
      50% { box-shadow: 0 0 0 6px #ff333300; }
    }

    #input {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
      resize: none;
      overflow-y: auto;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    #input:focus { border-color: var(--red-border); }
    #input::placeholder { color: var(--text-dim); }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: none;
      background: var(--red);
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { background: var(--bg3); color: var(--text-dim); }

    /* ── MEMORY PANEL ── */
    .memory-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000cc;
      z-index: 100;
      align-items: flex-end;
    }

    .memory-panel.open { display: flex; }

    .memory-sheet {
      background: var(--bg2);
      border-radius: 20px 20px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      padding: 20px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .memory-sheet::-webkit-scrollbar { width: 0; }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .sheet-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--red);
      letter-spacing: 0.15em;
      margin-bottom: 16px;
      font-family: 'DM Mono', monospace;
    }

    .memory-item {
      padding: 10px 12px;
      background: var(--bg3);
      border-radius: 8px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
    }

    .memory-key {
      font-size: 10px;
      color: var(--red);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      margin-bottom: 3px;
    }

    .memory-val {
      font-size: 13px;
      color: var(--text);
    }

    .section-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      margin: 14px 0 8px;
      font-family: 'DM Mono', monospace;
    }

    /* ── UPLOAD ── */
    .upload-bar {
      padding: 8px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 5px 10px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      transition: all 0.15s;
      font-family: 'DM Mono', monospace;
    }

    .upload-label:hover {
      border-color: var(--red-border);
      color: var(--red);
    }

    /* ── JOB CARD & MODAL STYLES ── */
    .job-cards-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .job-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      transition: border-color 0.15s;
    }

    .job-card:hover {
      border-color: var(--red-border);
    }

    .job-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .job-card-company {
      font-size: 12px;
      color: var(--red);
      font-family: 'DM Mono', monospace;
      margin-bottom: 8px;
    }

    .job-card-snippet {
      font-size: 12px;
      color: var(--text-mid);
      line-height: 1.4;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .job-card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-view {
      flex: 1;
      padding: 6px 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }

    .btn-apply {
      padding: 6px 14px;
      background: var(--red);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ── JOB DETAIL MODAL ── */
    .job-modal-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000dd;
      z-index: 120;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .job-modal-panel.open {
      display: flex;
    }

    .job-modal-sheet {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.2s ease;
    }

    .job-modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .job-modal-header h2 {
      font-size: 16px;
      color: var(--text);
    }

    .job-modal-header p {
      font-size: 12px;
      color: var(--red);
      font-family: 'DM Mono', monospace;
    }

    .job-modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 20px;
      cursor: pointer;
    }

    .job-modal-body {
      padding: 16px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      flex: 1;
    }

    .job-modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ── STATS BAR (success rate, top-left, outside chat) ── */
.stats-bar {
  padding: 6px 18px 0;
  background: var(--bg);
  flex-shrink: 0;
}

.success-rate-badge {
  display: inline-block;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 10px;
  color: var(--text-mid);
  font-family: 'DM Mono', monospace;
}

/* ── APPLY-ALL PROGRESS TAB ── */
.apply-progress-panel {
  display: none;
  position: fixed;
  top: 66px;
  left: 12px;
  right: 12px;
  max-width: 456px;
  margin: 0 auto;
  z-index: 130;
  background: var(--bg2);
  border: 1px solid var(--red-border);
  border-radius: 12px;
  padding: 12px 14px;
  box-shadow: 0 8px 24px #000000aa;
}

.apply-progress-panel.open { display: block; }

.apply-progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.apply-progress-company {
  font-size: 13px;
  color: var(--red);
  font-family: 'DM Mono', monospace;
  margin-bottom: 8px;
  min-height: 16px;
}

.apply-progress-track {
  height: 6px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
}

.apply-progress-fill {
  height: 100%;
  width: 0%;
  background: var(--red);
  transition: width 0.2s ease;
}

  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="logo">D</div>
      <div class="header-info">
        <h1>DOOM</h1>
        <div class="status">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">online</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <div class="icon-btn" id="speak-btn" onclick="toggleSpeak()" title="Toggle voice">🔊</div>
      <div class="icon-btn" onclick="getBriefing()" title="Daily Briefing">☀️</div>
      <div class="icon-btn" onclick="toggleMemory()" title="Memory">🧠</div>
      <div class="icon-btn" onclick="clearChat()" title="Clear">🗑</div>
    </div>
  </div>


  <!-- STATS BAR -->
<div class="stats-bar">
  <div class="success-rate-badge" id="success-rate-badge">📊 --</div>
</div>


  <!-- UPLOAD BAR -->
  <div class="upload-bar">
    <label class="upload-label">
      📎 upload document
      <input type="file" id="file-upload" accept=".pdf,.txt,.md" style="display:none" onchange="uploadDoc(this)" />
    </label>
  </div>

  <!-- MESSAGES -->
  <div id="messages">
    <div class="msg-row">
      <div class="avatar doom">D</div>
      <div class="bubble doom">Hey Athul! DOOM online and ready 🔥<br/>Voice, search, reminders, calls — just ask.</div>
    </div>
  </div>

  <!-- VOICE BANNER -->
  <div class="voice-banner" id="voice-banner">🎤 listening... speak now</div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="composer">
      <textarea id="input" placeholder="Message DOOM..." rows="1"></textarea>
      <button class="mic-btn" id="mic" aria-label="Voice input">🎤</button>
      <button class="send-btn" id="send" aria-label="Send message">➤</button>
    </div>
  </div>

</div>

<!-- MEMORY PANEL -->
<div class="memory-panel" id="memory-panel" onclick="closeMemory(event)">
  <div class="memory-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">🧠 DOOM MEMORY</div>
    <div id="memory-content"></div>
  </div>
</div>

<!-- JOB DETAIL MODAL -->
<div class="job-modal-panel" id="job-modal" onclick="closeJobModal(event)">
  <div class="job-modal-sheet">
    <div class="job-modal-header">
      <div>
        <h2 id="modal-job-title">Job Title</h2>
        <p id="modal-job-company">Company</p>
      </div>
      <button class="job-modal-close" onclick="forceCloseJobModal()">✕</button>
    </div>
    <div class="job-modal-body" id="modal-job-desc">
      Full job description will appear here...
    </div>
    <div class="job-modal-footer">
      <a id="modal-job-url" href="#" target="_blank" style="font-size: 12px; color: var(--text-dim); text-decoration: underline;">View Original Link</a>
      <button class="btn-apply" id="modal-apply-btn">Apply Now 🚀</button>
    </div>
  </div>
</div>

<div class="apply-progress-panel" id="apply-progress-panel">
  <div class="apply-progress-header">
    <span id="apply-progress-label">Applying 0/0</span>
    <button class="job-modal-close" onclick="cancelApplyAll()">✕</button>
  </div>
  <div class="apply-progress-company" id="apply-progress-company">—</div>
  <div class="apply-progress-track">
    <div class="apply-progress-fill" id="apply-progress-fill"></div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const micBtn = document.getElementById('mic');
const voiceBanner = document.getElementById('voice-banner');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const speakBtn = document.getElementById('speak-btn');


window.onload = function () {

window._speakOutput = true;
speakBtn.classList.add('active');
speakBtn.textContent = '🔊';

let audioQueue = [];
let isPlaying = false;
let currentAudio = null;



function toggleSpeak() {
  window._speakOutput = !window._speakOutput;
  speakBtn.classList.toggle('active', window._speakOutput);
  speakBtn.textContent = window._speakOutput ? '🔊' : '🔇';
  if (!window._speakOutput) {
    audioQueue = [];
    isPlaying = false;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  }
}

function processQueue() {
  if (!window._speakOutput || audioQueue.length === 0) {
    isPlaying = false;
    currentAudio = null;
    return;
  }
  isPlaying = true;
  const audio = audioQueue.shift();
  currentAudio = audio;
  audio.onended = () => { currentAudio = null; processQueue(); };
  audio.onerror = () => { currentAudio = null; processQueue(); };
  audio.play().catch(() => processQueue());
}

function speak(text) {
  if (!window._speakOutput || !text || !text.trim()) return;
  
  const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
  
  sentences.forEach((sentence, i) => {
    const clean = sentence.trim();
    if (!clean) return;
    fetch('/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: clean })
    })
    .then(r => r.blob())
    .then(blob => {
      const audio = new Audio(URL.createObjectURL(blob));
      audioQueue.push(audio);
      if (!isPlaying) processQueue();
    })
    .catch(e => console.log('TTS:', e));
  });
}

function handleSpecialResponse(response) {
  if (response.includes('JOBS_DATA:')) {
    try {
      const rawJson = response.replace('JOBS_DATA:', '').trim();
      const jobs = JSON.parse(rawJson);
      return renderJobCards(jobs);
    } catch (e) {
      console.error('Failed to parse jobs payload', e);
    }
  }

  if (response.includes('APPLY_REPORT:')) {
    return response.replace('APPLY_REPORT:', '').replace(/\n/g, '<br/>');
  }

  if (response.includes('CALL:')) {
    const match = response.match(/CALL:(\+?\d+):(.+)/);
    if (match) {
      if (confirm(`📞 Call ${match[2]}?`)) {
        window.location.href = `tel:${match[1]}`;
      }
      return `📞 Calling ${match[2]}...`;
    }
  }

  if (response.includes('WHATSAPP:')) {
    const match = response.match(/WHATSAPP:(\d+):([\s\S]*)/);
    if (match) {
      const number = match[1];
      const message = match[2] || '';
      const waApp = `whatsapp://send?phone=${number}&text=${encodeURIComponent(message)}`;
      const waWeb = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;

      const link = document.createElement('a');
      link.href = waApp;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      setTimeout(() => {
        window.open(waWeb, '_blank');
      }, 1500);

      return `💬 Opening WhatsApp...`;
    }
  }

  if (response.includes('WA_NOT_FOUND:')) {
    const match = response.match(/WA_NOT_FOUND:(.+)/);
    const name = match ? match[1] : 'contact';
    return `❌ Contact "${name}" not found. Try: "add contact ${name} +91XXXXXXXXXX"`;
  }

  if (response.includes('CALL_NOT_FOUND:')) {
    const match = response.match(/CALL_NOT_FOUND:(.+)/);
    const name = match ? match[1] : 'contact';
    return `❌ Contact "${name}" not found. Try: "add contact ${name} +91XXXXXXXXXX"`;
  }

  if (response.includes('LINKEDIN_AUTH_REQUIRED')) {
    window.open('/linkedin/auth', '_blank');
    return '🔗 Opening LinkedIn login... Come back after connecting!';
  }

  return response;
}


// Multi-command batch handling.
// A multi-line message is treated as ONE user submission. Each line is
// processed independently, but the UI waits until ALL results are ready
// and then renders one modern grouped answer.
async function sendMessage(text) {
  text = text || inputEl.value;
  if (!text || !text.trim()) return;

  inputEl.value = '';
  inputEl.style.height = '28px';
  inputEl.scrollTop = 0;

  const commands = text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(Boolean);

  if (!commands.length) return;

  // Normal single-command behavior stays unchanged.
  if (commands.length === 1) {
    await sendSingleMessage(commands[0]);
    return;
  }

  await sendBatchAsOneAnswer(commands);
}

async function sendBatchAsOneAnswer(commands) {
  audioQueue = [];
  isPlaying = false;
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  sendBtn.disabled = true;
  setStatus('thinking');

  // Show the complete user submission as one message, like modern LLMs.
  addMessage('user', commands.map(escapeHtml).join('<br>'));

  const resultBubble = addMessage(
    'doom',
    '<div class="thinking-dots"><span></span><span></span><span></span></div>'
  );

  try {
    const results = [];

    // Process through the SAME /chat-stream endpoint and response format
    // used by the existing single-message function. We intentionally wait
    // for each request here because the backend may use shared session/tool
    // state. The user sees nothing until all requested companies finish.
    for (const command of commands) {
      const result = await collectChatResult(command);
      results.push({ command, result });
    }

    resultBubble.innerHTML = renderBatchResults(results);

  } catch (e) {
    console.error('Batch processing error:', e);
    resultBubble.innerHTML =
      '❌ Could not complete the batch request.<br>' +
      '<span style="color:var(--text-dim)">Please try again.</span>';
  }

  sendBtn.disabled = false;
  setStatus('online');
  inputEl.focus();
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function collectChatResult(text) {
  const res = await fetch('/chat-stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  });

  if (!res.ok || !res.body) {
    throw new Error(`HTTP ${res.status || 'stream unavailable'}`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let finalResponse = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split('\n\n');
    buffer = events.pop() || '';

    for (const evt of events) {
      const line = evt.trim();
      if (!line.startsWith('data: ')) continue;

      try {
        const data = JSON.parse(line.slice(6));

        if (data.type === 'text') {
          finalResponse = data.content || finalResponse;
        }

        if (data.type === 'audio' && window._speakOutput) {
          const audio = new Audio(data.url + '?t=' + Date.now());
          audioQueue.push(audio);
          if (!isPlaying) processQueue();
        }
      } catch (e) {
        console.error('SSE parse error:', e, line.slice(0, 200));
      }
    }
  }

  // Handle a final SSE event that did not end with \n\n.
  if (buffer.trim().startsWith('data: ')) {
    try {
      const data = JSON.parse(buffer.trim().slice(6));
      if (data.type === 'text') finalResponse = data.content || finalResponse;
    } catch (_) {}
  }

  return finalResponse || 'No result returned.';
}

function renderBatchResults(results) {
  return `<div class="batch-results">${results.map(({ command, result }) => {
    const company = extractCompanyName(command);
    const display = handleSpecialResponse(result);

    return `
      <section class="batch-result">
        <div class="batch-company">${escapeHtml(company)}</div>
        <div class="batch-finding">Finding HR email</div>
        <div class="batch-content">${display}</div>
      </section>
    `;
  }).join('')}</div>`;
}

function extractCompanyName(command) {
  const match = command.match(/^find\s+(?:the\s+)?(?:hr|human\s+resources)\s+email\s+for\s+(.+)$/i);
  if (match) return match[1].trim();

  const forMatch = command.match(/\bfor\s+(.+)$/i);
  return forMatch ? forMatch[1].trim() : command;
}

function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = value == null ? '' : String(value);
  return div.innerHTML;
}

async function sendSingleMessage(text) {
  audioQueue = [];
  isPlaying = false;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  sendBtn.disabled = true;
  setStatus('thinking');

  addMessage('user', text);
  const thinking = addMessage('doom', '<div class="thinking-dots"><span></span><span></span><span></span></div>');

  try {
    const res = await fetch('/chat-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop();

      for (const evt of events) {
        const line = evt.trim();
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.type === 'text') {
            const display = handleSpecialResponse(data.content);
            thinking.innerHTML = display;
          }
          if (data.type === 'audio' && window._speakOutput) {
            const audio = new Audio(data.url + '?t=' + Date.now());
            audioQueue.push(audio);
            if (!isPlaying) processQueue();
          }
        } catch (e) {
          console.error('SSE parse error:', e, line.slice(0, 200));
        }
      }
    }
  } catch (e) {
    thinking.innerHTML = 'Connection error. Is server running?';
  }

  sendBtn.disabled = false;
  setStatus('online');
  inputEl.focus();
}

function autoResizeInput() {

  inputEl.style.height = `${Math.max(26, nextHeight)}px`;
  inputEl.style.overflowY = inputEl.scrollHeight > maxHeight ? 'auto' : 'hidden';
}

  };

  recognition.onend = () => stopListening();
  recognition.onerror = () => stopListening();

  function stopListening() {
    isListening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤';

async function applyToAll() {
  if (window._applyAllRunning) return;
  const jobs = window._loadedJobs;
  if (!jobs.length) return;

  if (!confirm(`Apply to all ${jobs.length} jobs (platform automation + email + direct links)?`)) return;

  window._applyAllRunning = true;
  window._applyAllCancelled = false;

  const btn = document.getElementById('apply-all-btn');
  if (btn) btn.disabled = true;

  const panel = document.getElementById('apply-progress-panel');
  const label = document.getElementById('apply-progress-label');
  const companyEl = document.getElementById('apply-progress-company');
  const fill = document.getElementById('apply-progress-fill');
  if (panel) panel.classList.add('open');

  let applied = 0, failed = 0;

  for (let i = 0; i < jobs.length; i++) {
    if (window._applyAllCancelled) break;
    if (!document.getElementById(`job-card-${i}`)) continue; // already removed individually earlier

    const job = jobs[i];
    if (label) label.textContent = `Applying ${i + 1}/${jobs.length}`;
    if (companyEl) companyEl.textContent = job.company || 'Hiring Company';
    if (fill) fill.style.width = `${Math.round(((i + 1) / jobs.length) * 100)}%`;

    try {
      const res = await fetch('/api/apply-single-job', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ index: i })
      });
      const data = await res.json();

      if (data.apply_url) window.open(data.apply_url, '_blank');

      if (data.success) {
        applied++;
        removeJobCard(i);
      } else {
        failed++;
      }
    } catch (e) {
      failed++;
    }

    await new Promise(r => setTimeout(r, 500));
  }

  if (label) {
    label.textContent = window._applyAllCancelled
      ? `Cancelled: ${applied} applied, ${failed} failed`
      : `Done: ${applied} applied, ${failed} failed`;
  }
  if (companyEl) companyEl.textContent = '';
  setTimeout(() => { if (panel) panel.classList.remove('open'); }, 2500);

  if (btn) { btn.disabled = false; btn.textContent = 'Apply All 🚀'; }
  window._applyAllRunning = false;
  updateSuccessRate();
}

  const jobs = window._loadedJobs;
  const platformJobs = jobs
    .map((job, idx) => ({ job, idx }))
    .filter(({ job }) => job.auto_apply);

  if (!platformJobs.length) {
    alert('No platform-automatable jobs (Naukri/Wellfound) in this list.');
    return;
  }

  if (!confirm(`Queue ${platformJobs.length} jobs for Naukri/Wellfound automation + email?`)) return;

  window._applyAllRunning = true;
  const btn = document.getElementById('apply-platforms-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Queuing...'; }

  const panel = document.getElementById('apply-progress-panel');
  const label = document.getElementById('apply-progress-label');
  const companyEl = document.getElementById('apply-progress-company');
  const fill = document.getElementById('apply-progress-fill');
  if (panel) panel.classList.add('open');

  let applied = 0, failed = 0;

  for (let i = 0; i < platformJobs.length; i++) {
    if (window._applyAllCancelled) break;
    const { job, idx } = platformJobs[i];

    if (label) label.textContent = `Queuing ${i + 1}/${platformJobs.length}`;
    if (companyEl) companyEl.textContent = job.company || 'Hiring Company';
    if (fill) fill.style.width = `${Math.round(((i + 1) / platformJobs.length) * 100)}%`;

    try {
      const res = await fetch('/api/apply-single-job', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ index: idx })
      });
      const data = await res.json();
      if (data.success) {
        applied++;
        removeJobCard(idx);
      } else {
        failed++;
      }
    } catch (e) {
      failed++;
    }

    await new Promise(r => setTimeout(r, 500));
  }

  if (label) label.textContent = `Done: ${applied} queued, ${failed} failed`;
  if (companyEl) companyEl.textContent = '';
  setTimeout(() => { if (panel) panel.classList.remove('open'); }, 2500);

  if (btn) { btn.disabled = false; btn.textContent = '🤖 Platform Apply All'; }
  window._applyAllRunning = false;
  updateSuccessRate();
}
</script>
</body>
</html>
