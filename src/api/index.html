<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>DOOM AI</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DOOM" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="app">

  <!-- HEADER (minimal — just identity + status) -->
  <div class="header">
    <div class="header-left">
      <div class="logo">D</div>
      <div class="header-info">
        <h1>DOOM</h1>
        <div class="status">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">online</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <div class="success-rate-badge" id="success-rate-badge">📊 --</div>
    </div>
  </div>

  <!-- LANDING GREETING (fades out on first interaction) -->
  <div class="landing-hero" id="landing-hero">
    <div class="hero-mark">D</div>
    <h1 class="hero-greeting" id="hero-greeting">Hi there 👋</h1>
    <p class="hero-sub" id="hero-sub">I'm DOOM — Athul's personal AI assistant.</p>
  </div>

  <!-- MESSAGES -->
  <div id="messages"></div>

  <!-- VOICE BANNER -->
  <div class="voice-banner" id="voice-banner">🎤 listening... speak now</div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="composer">
      <div class="plus-menu-wrap">
        <button class="plus-btn" id="plus-btn" aria-label="More actions" type="button">+</button>
        <div class="plus-menu" id="plus-menu">
          <label class="plus-menu-item" for="file-upload">📎 Upload document</label>
          <button class="plus-menu-item" id="menu-briefing-btn" type="button">☀️ Daily briefing</button>
          <button class="plus-menu-item" id="menu-memory-btn" type="button">🧠 Memory</button>
          <button class="plus-menu-item" id="menu-clear-btn" type="button">🗑 Clear chat</button>
        </div>
      </div>

      <input type="file" id="file-upload" accept=".pdf,.txt,.md" style="display:none" />

      <textarea id="input" placeholder="Message DOOM..." rows="1"></textarea>

      <button class="mic-btn" id="mic" aria-label="Voice input" type="button">🎤</button>
      <button class="audio-btn" id="speak-btn" aria-label="Toggle voice" type="button">🔊</button>
      <button class="send-btn" id="send" aria-label="Send message" type="button">➤</button>
    </div>
  </div>

</div>

<!-- MEMORY PANEL -->
<div class="memory-panel" id="memory-panel">
  <div class="memory-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">🧠 DOOM MEMORY</div>
    <div id="memory-content"></div>
  </div>
</div>

<!-- JOB DETAIL MODAL -->
<div class="job-modal-panel" id="job-modal">
  <div class="job-modal-sheet">
    <div class="job-modal-header">
      <div>
        <h2 id="modal-job-title">Job Title</h2>
        <p id="modal-job-company">Company</p>
      </div>
      <button class="job-modal-close" id="job-modal-close-btn">✕</button>
    </div>
    <div class="job-modal-body" id="modal-job-desc">
      Full job description will appear here...
    </div>
    <div class="job-modal-footer">
      <a id="modal-job-url" href="#" target="_blank" style="font-size: 12px; color: var(--text-dim); text-decoration: underline;">View Original Link</a>
      <button class="btn-apply" id="modal-apply-btn">Apply Now 🚀</button>
    </div>
  </div>
</div>

<div class="apply-progress-panel" id="apply-progress-panel">
  <div class="apply-progress-header">
    <span id="apply-progress-label">Applying 0/0</span>
    <button class="job-modal-close" id="apply-progress-close-btn">✕</button>
  </div>
  <div class="apply-progress-company" id="apply-progress-company">—</div>
  <div class="apply-progress-track">
    <div class="apply-progress-fill" id="apply-progress-fill"></div>
  </div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
