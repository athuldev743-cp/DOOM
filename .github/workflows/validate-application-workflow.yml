name: Validate application workflow

on:
  pull_request:
    paths:
      - "src/api/routes/chat.py"
      - "src/api/schemas.py"
      - "src/api/static/js/jobs.js"
      - "src/memory/database.py"
      - "src/scripts/scan_jobs.py"
      - "src/tools/email_tool.py"
      - "src/tools/jobs_tool.py"
      - "src/tools/jsearch_client.py"
      - "src/tools/resume_builder.py"
      - "data/resumes/master_resume.json"
      - "requirements.txt"
      - ".github/workflows/validate-application-workflow.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: |
          python -m py_compile \
            src/api/routes/chat.py \
            src/api/schemas.py \
            src/memory/database.py \
            src/scripts/scan_jobs.py \
            src/tools/email_tool.py \
            src/tools/jobs_tool.py \
            src/tools/jsearch_client.py \
            src/tools/resume_builder.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check job UI JavaScript syntax
        run: node --input-type=module --check < src/api/static/js/jobs.js
